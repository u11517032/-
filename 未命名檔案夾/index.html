<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人作品集 - 大一新鮮人</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; line-height: 1.6; }
        header { background: #2c3e50; color: #fff; text-align: center; padding: 3rem 1rem; }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { font-size: 1.2rem; color: #bdc3c7; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        section { background: #fff; padding: 2rem; margin-bottom: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 0.5rem; }
        .projects-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .project-card { background: #ecf0f1; padding: 1rem; border-radius: 6px; }
        footer { text-align: center; padding: 1.5rem; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>你好，我是 [你的名字]</h1>
        <p>充滿熱情的大學一年級新鮮人 | 持續學習與探索中</p>
    </header>

    <div class="container">
        <section>
            <h2>關於我</h2>
            <p>我是目前就讀某大學的一年級學生。這個網站是我的個人作品集雛型，我會在未來的四年內，將所學到的專業技能、專案經歷與成就在這裡逐步擴充，目標是成為讓業界驚豔的專業人才！</p>
        </section>

        <section>
            <h2>目前技能</h2>
            <ul>
                <li>網頁基礎：HTML, CSS</li>
                <li>版本控制：Git, GitHub</li>
                <li>熱門工具：VS Code, AI 協作工具</li>
            </ul>
        </section>

        <section>
            <h2>精選作品 / 專題</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <h3>期末專題預告</h3>
                    <p>正在努力學習中！大一結束前會在這裡上傳我的第一個完整網頁專題。</p>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 [你的名字]. All Rights Reserved.</p>
    </footer>

</body>
</html>
