<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>放學後社團體驗表</title>
</head>
<body>

    <h1>放學後社團體驗表</h1>
    <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>

    <form>
        <p>
            <label for="nickname">我的暱稱</label><br>
            <input type="text" id="nickname" name="nickname" placeholder="例如小星星">
        </p>

        <p>
            <label for="club">想體驗的社團</label><br>
            <select id="club" name="club">
                <option value="">請選擇社團</option>
                <option value="theater">故事劇場</option>
                <option value="science">科學手作</option>
                <option value="boardgame">桌遊挑戰</option>
            </select>
        </p>

        <fieldset>
            <legend>方便參加的日子</legend>
            <p>
                <label><input type="radio" name="day" value="tue"> 星期二</label>
                <label><input type="radio" name="day" value="thu"> 星期四</label>
                <label><input type="radio" name="day" value="fri"> 星期五</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>我期待的活動方式</legend>
            <p>
                <label><input type="checkbox" name="method" value="craft"> 動手製作</label>
                <label><input type="checkbox" name="method" value="team"> 和同學合作</label>
                <label><input type="checkbox" name="method" value="share"> 上台分享</label>
            </p>
        </fieldset>

        <p>
            <label for="message">想告訴老師的事</label><br>
            <textarea id="message" name="message" rows="5" cols="32" placeholder="例如我想和同學一起完成一個小作品"></textarea>
        </p>

        <!-- 自訂新增欄位 -->
        <p>
            <label for="snack">飲食習慣需求（自訂欄位）</label><br>
            <select id="snack" name="snack">
                <option value="none">無特殊需求</option>
                <option value="vege">素食</option>
            </select>
        </p>
        <p>選擇理由：活動提供點心，使用下拉選單可以讓學生快速選擇個人飲食需求，選項固定且清晰。</p>

        <p>
            <button type="button" disabled>練習版，尚未開放報名</button>
        </p>
    </form>

</body>
</html>
